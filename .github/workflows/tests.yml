name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check tools
        run: python -m pip install --quiet pytest ruff mypy pyyaml

      - name: Lint
        run: ruff check --select E,F,I --line-length 100 hooks scripts tests

      - name: Type check
        run: |
          mypy --strict hooks/lean_dispatch_nudge.py scripts/measure_subagents.py scripts/make_visuals.py
          cd scripts && mypy --strict ari weekly_burn.py skill_mcp_audit.py ari_report.py ari_nightly.py

      - name: README diagrams match their spec
        run: python scripts/make_visuals.py --check

      - name: Hook, measurement and ARI tests
        run: pytest -q -p no:cacheprovider tests

      - name: Agent frontmatter is valid YAML
        run: |
          python - <<'PY'
          import yaml
          import xml.etree.ElementTree as ET, glob
          for svg in glob.glob("assets/visuals/*.svg"):
              ET.parse(svg)
          for path in ("agents/lean-worker.md", "agents/lean-checker.md"):
              meta = yaml.safe_load(open(path).read().split("---")[1])
              for key in ("name", "description", "tools", "model"):
                  assert meta.get(key), f"{path}: missing {key}"
              assert meta["omitClaudeMd"] is True, f"{path}: omitClaudeMd must be true"
              assert "Skill" not in meta["tools"] and "mcp__" not in meta["tools"], path
              print(path, "ok")
          PY

      - name: Install and uninstall in a throwaway home
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --hook
          test -f "$HOME/.claude/agents/lean-worker.md"
          test -f "$HOME/.claude/agents/lean-checker.md"
          test -f "$HOME/.claude/hooks/lean_dispatch_nudge.py"
          echo "edited" >> "$HOME/.claude/agents/lean-checker.md"
          ./uninstall.sh --hook
          test ! -e "$HOME/.claude/agents/lean-worker.md"
          ls "$HOME"/.claude/agents/lean-checker.md.bak-* > /dev/null
          test ! -e "$HOME/.claude/hooks/lean_dispatch_nudge.py"
          if ./uninstall.sh --bogus; then echo "bad flag accepted"; exit 1; fi

      - name: Measurement script runs on a synthetic transcript
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/p/s/subagents"
          for i in 1 2 3; do
            echo '{"agentType":"lean-worker"}' > "$root/p/s/subagents/a$i.meta.json"
            echo "{\"type\":\"assistant\",\"message\":{\"usage\":{\"input_tokens\":${i}000}}}" > "$root/p/s/subagents/a$i.jsonl"
          done
          python scripts/measure_subagents.py --root "$root" | tee out.txt
          grep -E "lean-worker +3 +2.0k" out.txt

      - name: ARI tools run on a synthetic transcript
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/p/s/subagents"
          for d in 1 2 3 4 5; do
            echo "{\"type\":\"assistant\",\"requestId\":\"r$d\",\"timestamp\":\"2026-10-2${d}T10:00:00Z\",\"message\":{\"model\":\"m\",\"usage\":{\"input_tokens\":${d}000}}}" >> "$root/p/s.jsonl"
          done
          cd scripts
          python weekly_burn.py --root "$root" --now 2026-10-26T12:00:00Z | tee burn.txt
          grep -q "Provider quota ETA: unavailable" burn.txt
          python skill_mcp_audit.py --root "$root" --skills-root "$root/none" --mcp-config "$root/none.json" --now 2026-10-26T12:00:00Z
          python ari_report.py --root "$root" --now 2026-10-26T12:00:00Z --out "$root/r.html" --share "$root/s.json" --skills-root "$root/none" --mcp-config "$root/none.json"
          ! grep -qi "<script" "$root/r.html"
          python ari_nightly.py run --root "$root" --state-dir "$root/state" --now 2026-10-26T12:00:00Z --quiet-seconds 0
