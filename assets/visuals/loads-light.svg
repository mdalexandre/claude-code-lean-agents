s. Red: loaded on every turn, whether the job needs it or not.</text><text x="32.0" y="533.0" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">654 of 852 general-purpose runs (77%) never called a single MCP tool.</text></svg>
