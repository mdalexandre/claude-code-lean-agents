<svg xmlns="http://www.w3.org/2000/svg" width="880" height="289" viewBox="0 0 880 289" font-family="Google Sans, Roboto, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Every turn re-sends that load"><title>Every turn re-sends that load</title><rect x="0.5" y="0.5" width="879.0" height="288.0" rx="12" fill="#FFFFFF" stroke="#DADCE0"/><text x="32.0" y="46.0" font-size="21" font-weight="600" fill="#202124" text-anchor="start">Every turn re-sends that load</text><text x="32.0" y="72.0" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Starting load sent over a 10 turn job</text><text x="32.0" y="125.0" font-size="15" font-weight="400" fill="#202124" text-anchor="start">general-purpose</text><rect x="200.0" y="104.0" width="500.0" height="30.0" rx="6" fill="#F1F3F4" stroke="none"/><rect x="200.0" y="104.0" width="500.0" height="30.0" rx="6" fill="#D93025" stroke="none"/><line x1="250.0" x2="250.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="300.0" x2="300.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="350.0" x2="350.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="400.0" x2="400.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="450.0" x2="450.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="500.0" x2="500.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="550.0" x2="550.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="600.0" x2="600.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><line x1="650.0" x2="650.0" y1="104" y2="134" stroke="#FFFFFF" stroke-width="2"/><text x="225.0" y="152.0" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">1 turn</text><text x="710.0" y="125.0" font-size="14" font-weight="600" fill="#202124" text-anchor="start">1.31M tokens</text><text x="32.0" y="191.0" font-size="15" font-weight="600" fill="#202124" text-anchor="start">lean-worker</text><rect x="200.0" y="170.0" width="500.0" height="30.0" rx="6" fill="#F1F3F4" stroke="none"/><rect x="200.0" y="170.0" width="28.2" height="30.0" rx="6" fill="#137333" stroke="none"/><text x="238.2" y="191.0" font-size="14" font-weight="600" fill="#202124" text-anchor="start">74k tokens</text><text x="32.0" y="248.0" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Starting load times 10 turns. The job&#x27;s own tokens come on top, and they are the same for both.</text><text x="32.0" y="267.0" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Cached reads cost less, but they still count toward your usage.</text></svg>
