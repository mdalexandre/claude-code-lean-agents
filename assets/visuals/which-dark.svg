<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650" font-family="Google Sans, Roboto, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Which agent should take the job?"><title>Which agent should take the job?</title><rect x="0.5" y="0.5" width="879.0" height="649.0" rx="12" fill="#0D1117" stroke="#30363D"/><text x="32.0" y="46.0" font-size="21" font-weight="600" fill="#E8EAED" text-anchor="start">Which agent should take the job?</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA0A6"/></marker></defs><rect x="92.0" y="76.0" width="280.0" height="40.0" rx="20" fill="#161B22" stroke="#30363D"/><text x="232.0" y="101.0" font-size="15" font-weight="400" fill="#E8EAED" text-anchor="middle">A job to hand to a subagent</text><line x1="232.0" y1="116.0" x2="232.0" y2="144.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><rect x="32.0" y="146.0" width="400.0" height="56.0" rx="10" fill="#161B22" stroke="#30363D"/><text x="232.0" y="179.5" font-size="16" font-weight="500" fill="#E8EAED" text-anchor="middle">Does it need an MCP tool or a skill?</text><line x1="432.0" y1="174.0" x2="516.0" y2="174.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="476.0" y="166.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="middle">Yes</text><rect x="520.0" y="150.0" width="328.0" height="48.0" rx="24.0" fill="#8AB4F8" stroke="none"/><text x="684.0" y="179.5" font-size="16" font-weight="600" fill="#0D1117" text-anchor="middle">general-purpose, or a specialist</text><line x1="232.0" y1="202.0" x2="232.0" y2="244.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="242.0" y="229.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="start">No</text><rect x="32.0" y="246.0" width="400.0" height="56.0" rx="10" fill="#161B22" stroke="#30363D"/><text x="232.0" y="279.5" font-size="16" font-weight="500" fill="#E8EAED" text-anchor="middle">Does it rely on long rules in CLAUDE.md?</text><line x1="432.0" y1="274.0" x2="516.0" y2="274.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="476.0" y="266.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="middle">Yes</text><rect x="520.0" y="250.0" width="328.0" height="48.0" rx="24.0" fill="#8AB4F8" stroke="none"/><text x="684.0" y="279.5" font-size="16" font-weight="600" fill="#0D1117" text-anchor="middle">general-purpose</text><line x1="232.0" y1="302.0" x2="232.0" y2="344.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="242.0" y="329.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="start">No</text><rect x="32.0" y="346.0" width="400.0" height="56.0" rx="10" fill="#161B22" stroke="#30363D"/><text x="232.0" y="379.5" font-size="16" font-weight="500" fill="#E8EAED" text-anchor="middle">Is it a broad, read only code search?</text><line x1="432.0" y1="374.0" x2="516.0" y2="374.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="476.0" y="366.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="middle">Yes</text><rect x="520.0" y="350.0" width="328.0" height="48.0" rx="24.0" fill="#FDD663" stroke="none"/><text x="684.0" y="379.5" font-size="16" font-weight="600" fill="#202124" text-anchor="middle">Explore (built in)</text><line x1="232.0" y1="402.0" x2="232.0" y2="444.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="242.0" y="429.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="start">No</text><rect x="32.0" y="446.0" width="400.0" height="56.0" rx="10" fill="#161B22" stroke="#30363D"/><text x="232.0" y="479.5" font-size="16" font-weight="500" fill="#E8EAED" text-anchor="middle">Is it checking work against criteria?</text><line x1="432.0" y1="474.0" x2="516.0" y2="474.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="476.0" y="466.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="middle">Yes</text><rect x="520.0" y="450.0" width="328.0" height="48.0" rx="24.0" fill="#81C995" stroke="none"/><text x="684.0" y="479.5" font-size="16" font-weight="600" fill="#0D1117" text-anchor="middle">lean-checker</text><line x1="232.0" y1="502.0" x2="232.0" y2="544.0" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#a)"/><text x="242.0" y="529.0" font-size="13" font-weight="600" fill="#9AA0A6" text-anchor="start">No</text><rect x="72.0" y="546.0" width="320.0" height="48.0" rx="24.0" fill="#81C995" stroke="none"/><text x="232.0" y="575.5" font-size="16" font-weight="600" fill="#0D1117" text-anchor="middle">lean-worker</text><text x="32.0" y="628.0" font-size="13" font-weight="400" fill="#9AA0A6" text-anchor="start">lean-worker is the default for everything else: edits, scripts, tests, fetching a page.</text></svg>
